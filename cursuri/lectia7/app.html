    <input type="text" value="" id="input" />
    <br /><br />
    <input
      type="submit"
      onclick="add(&#39;+&#39;)"
      value="Voi adauga +"
    /><br />
    <input
      type="submit"
      onclick="add(&#39;-&#39;)"
      value="Voi adauga -"
    /><br />
    <input
      type="submit"
      onclick="add(&#39;/&#39;)"
      value="Voi adauga /"
    /><br />
    <input
      type="submit"
      onclick="add(&#39;*&#39;)"
      value="Voi adauga *"
    /><br />
    <br /><br />
    <input type="submit" onclick="add(&#39;1&#39;)" value="1" /><br />
    <input type="submit" onclick="add(&#39;2&#39;)" value="2" /><br />

    <input type="submit" onclick="add(&#39;7&#39;)" value="7" /><br />
    <input type="submit" onclick="add(&#39;8&#39;)" value="8" /><br />
    <input type="submit" onclick="add(&#39;9&#39;)" value="9" /><br />
    <input type="submit" onclick="add(&#39;0&#39;)" value="0" /><br />
    <button onclick="calculeaza()">Calculeaza</button>
    <button onclick="reset()">Clear</button>
