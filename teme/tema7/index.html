<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Calendar | Modern View</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero-background">
      <div class="floor-overlay"></div>

      <article class="calendar-card" aria-label="Current Date">
        <header class="calendar-header">
          <span id="month-name"></span>
        </header>
        <section class="calendar-body">
          <p id="day-name"></p>
          <h1 id="day-number"></h1>
          <p id="year"></p>
        </section>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
