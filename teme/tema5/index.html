<!doctype html>
<html lang="en">
  <head>

    <title>Tema 5</title>
  </head>
  <body>
    <div id="wrapper">
      <input type="text" value="" id="input" />
      <br /><br />
      <input
        type="submit"
        onclick="add(&#39;+&#39;)"
        value="Voi adauga +"
      /><br />
      <input
        type="submit"
        onclick="add(&#39;-&#39;)"
        value="Voi adauga -"
      /><br />
      <input
        type="submit"
        onclick="add(&#39;/&#39;)"
        value="Voi adauga /"
      /><br />
      <input
        type="submit"
        onclick="add(&#39;*&#39;)"
        value="Voi adauga *"
      /><br />
      <br /><br />
      <input type="submit" onclick="add(&#39;1&#39;)" value="1" /><br />
      <input type="submit" onclick="add(&#39;2&#39;)" value="2" /><br />
      <input type="submit" onclick="add(&#39;3&#39;)" value="3" /><br />
      <input type="submit" onclick="add(&#39;4&#39;)" value="4" /><br />
      <input type="submit" onclick="add(&#39;5&#39;)" value="5" /><br />
      <input type="submit" onclick="add(&#39;6&#39;)" value="6" /><br />
      <input type="submit" onclick="add(&#39;7&#39;)" value="7" /><br />
      <input type="submit" onclick="add(&#39;8&#39;)" value="8" /><br />
      <input type="submit" onclick="add(&#39;9&#39;)" value="9" /><br />
      <input type="submit" onclick="add(&#39;0&#39;)" value="0" /><br />
      <button onclick="calculeaza()">Calculeaza</button>
      <button onclick="reset()">Clear</button>
    </div>
    <script src="script.js"></script>
